<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 7</title>

    <link rel="stylesheet" href="style.css">

    <script src="app.js" defer></script>
</head>
<body>

    <h1>Order Form</h1>

    <form id="orderForm">
        
        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" >
            <span class="error" id="nameError"></span>
        </div>

    
        <div class="field">
            <label for="phone">Phone</label>
            <input type="text" id="phone">
            <span class="error" id="phoneError"></span>
        </div>

        <div class="field">
            <label for="product">Product</label>
            <select id="product">
                <option value="">Choose Product</option>
                <option value="espresso">espresso — 45 EGP</option>
                <option value="latte">latte — 65 EGP</option>
                <option value="croissant">croissant — 40 EGP</option>
            </select>
            <span class="error" id="productError"></span>
        </div>

        
        <div class="field">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" max="10" placeholder="1-10">
            <span class="error" id="quantityError"></span>
        </div>

        <button type="submit">Order</button>
    </form>


    <div id="orders"></div>

</body>
</html>
